name: Add Changelog Entry

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Entry title"
        required: true
      description:
        description: "Entry description"
        required: true
      type:
        description: "Type: launch | update | fix | meta | experiment"
        required: true
        default: "update"
      project:
        description: "Project name (optional)"
        required: false
      project_url:
        description: "Project URL (optional)"
        required: false
      version:
        description: "Version tag e.g. v1.2 (optional)"
        required: false

permissions:
  contents: write

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepend entry to CHANGELOG.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('CHANGELOG.json', 'utf8'));

            const lastId = data.changelog.length > 0
              ? parseInt(data.changelog[0].id, 10)
              : 0;

            const newEntry = {
              id: String(lastId + 1).padStart(3, '0'),
              date: new Date().toISOString().split('T')[0],
              version: context.payload.inputs.version || null,
              title: context.payload.inputs.title,
              description: context.payload.inputs.description,
              type: context.payload.inputs.type,
              tags: [],
              project: context.payload.inputs.project || null,
              projectUrl: context.payload.inputs.project_url || null,
            };

            data.changelog.unshift(newEntry);
            fs.writeFileSync('CHANGELOG.json', JSON.stringify(data, null, 2) + '\n');

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.json
          git commit -m "changelog: ${{ github.event.inputs.title }}"
          git push
